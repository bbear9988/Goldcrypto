<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Quản Trị Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-screen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-slate-800 p-8 rounded-2xl shadow-2xl w-full max-w-md border border-slate-700">
            <div class="text-center mb-6">
                <i class="fa-solid fa-user-shield text-4xl text-blue-500 mb-2"></i>
                <h2 class="text-2xl font-bold text-white">Đăng Nhập Admin</h2>
                <p class="text-slate-400 text-sm">Hệ thống quản trị tài khoản & giao dịch</p>
            </div>
            <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Tài khoản</label>
                    <input type="text" id="username" value="admin" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 text-white outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-300 mb-1">Mật khẩu</label>
                    <input type="password" id="password" value="123" required class="w-full px-4 py-2 bg-slate-700 border border-slate-600 rounded-lg focus:ring-2 focus:ring-blue-500 text-white outline-none">
                </div>
                <div id="login-error" class="text-red-400 text-sm hidden"></div>
                <button type="submit" class="w-full py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-semibold rounded-lg transition duration-200">Đăng Nhập</button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH DASHBOARD MAIN -->
    <div id="dashboard-screen" class="hidden">
        <!-- Header TopBar -->
        <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-chart-line text-blue-500 text-xl"></i>
                <h1 class="text-xl font-bold text-white">Admin Control Panel</h1>
            </div>
            <button onclick="handleLogout()" class="px-4 py-2 bg-red-600/20 text-red-400 hover:bg-red-600 hover:text-white rounded-lg text-sm transition font-medium">
                <i class="fa-solid fa-right-from-bracket mr-1"></i> Đăng xuất
            </button>
        </header>

        <main class="p-6 max-w-7xl mx-auto space-y-6">
            <!-- Thẻ Thống Kê OVERVIEW -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-5 gap-4">
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-semibold uppercase">Tổng Tài Khoản</p>
                    <p id="stat-total" class="text-2xl font-bold text-white mt-1">0</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-semibold uppercase">Đang Đăng Nhập (Online)</p>
                    <p id="stat-online" class="text-2xl font-bold text-green-400 mt-1">0</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-semibold uppercase">Tài Khoản Active</p>
                    <p id="stat-active" class="text-2xl font-bold text-blue-400 mt-1">0</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-semibold uppercase">Tài Khoản Inactive</p>
                    <p id="stat-inactive" class="text-2xl font-bold text-amber-400 mt-1">0</p>
                </div>
                <div class="bg-slate-800 p-5 rounded-xl border border-slate-700">
                    <p class="text-slate-400 text-xs font-semibold uppercase">Tổng Giao Dịch</p>
                    <p id="stat-transactions" class="text-2xl font-bold text-purple-400 mt-1">0</p>
                </div>
            </div>

            <!-- Bảng Danh Sách Người Dùng -->
            <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden shadow-lg">
                <div class="px-6 py-4 border-b border-slate-700 flex justify-between items-center">
                    <h2 class="text-lg font-bold text-white">Danh Sách Tài Khoản Hệ Thống</h2>
                    <button onclick="loadDashboardData()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs rounded-lg transition">
                        <i class="fa-solid fa-rotate mr-1"></i> Làm mới
                    </button>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-slate-300">
                        <thead class="bg-slate-700/50 text-slate-400 uppercase text-xs">
                            <tr>
                                <th class="px-6 py-3">ID</th>
                                <th class="px-6 py-3">Tài khoản</th>
                                <th class="px-6 py-3">Email</th>
                                <th class="px-6 py-3">Trạng thái Online</th>
                                <th class="px-6 py-3">Tình trạng TK</th>
                                <th class="px-6 py-3">Hoạt động cuối</th>
                                <th class="px-6 py-3 text-center">Giao dịch</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body" class="divide-y divide-slate-700">
                            <!-- Dữ liệu render JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        const API_BASE = '/api/admin';

        // Tự động kiểm tra Token khi load trang
        window.onload = () => {
            const token = localStorage.getItem('admin_token');
            if (token) {
                showDashboard();
            }
        };

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errDiv = document.getElementById('login-error');

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    localStorage.setItem('admin_token', data.token);
                    errDiv.classList.add('hidden');
                    showDashboard();
                } else {
                    errDiv.textContent = data.message;
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.textContent = 'Không thể kết nối máy chủ!';
                errDiv.classList.remove('hidden');
            }
        }

        function showDashboard() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('dashboard-screen').classList.remove('hidden');
            loadDashboardData();
        }

        function handleLogout() {
            localStorage.removeItem('admin_token');
            document.getElementById('dashboard-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
        }

        async function loadDashboardData() {
            const token = localStorage.getItem('admin_token');
            const headers = { 'Authorization': `Bearer ${token}` };

            // 1. Tải dữ liệu Overview
            try {
                const resOverview = await fetch(`${API_BASE}/overview`, { headers });
                const overview = await resOverview.json();
                if (overview.success) {
                    document.getElementById('stat-total').textContent = overview.data.totalUsers;
                    document.getElementById('stat-online').textContent = overview.data.onlineUsers;
                    document.getElementById('stat-active').textContent = overview.data.activeUsers;
                    document.getElementById('stat-inactive').textContent = overview.data.inactiveUsers;
                    document.getElementById('stat-transactions').textContent = overview.data.totalTransactions;
                }
            } catch(e) {}

            // 2. Tải danh sách User
            try {
                const resUsers = await fetch(`${API_BASE}/users`, { headers });
                const usersData = await resUsers.json();
                if (usersData.success) {
                    renderUsersTable(usersData.data);
                }
            } catch(e) {}
        }

        function renderUsersTable(users) {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = '';

            users.forEach(u => {
                const onlineBadge = u.isOnline 
                    ? `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-green-500/10 text-green-400 border border-green-500/20"><span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span> Online</span>`
                    : `<span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs font-medium bg-slate-700 text-slate-400">⚪ Offline</span>`;

                const statusBadge = u.status === 'ACTIVE'
                    ? `<span class="text-xs px-2 py-0.5 rounded bg-blue-500/10 text-blue-400 border border-blue-500/20">ACTIVE</span>`
                    : `<span class="text-xs px-2 py-0.5 rounded bg-red-500/10 text-red-400 border border-red-500/20">INACTIVE</span>`;

                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-mono text-xs text-slate-400">#${u.id}</td>
                    <td class="px-6 py-4 font-medium text-white">${u.username}</td>
                    <td class="px-6 py-4 text-slate-400">${u.email}</td>
                    <td class="px-6 py-4">${onlineBadge}</td>
                    <td class="px-6 py-4">${statusBadge}</td>
                    <td class="px-6 py-4 text-slate-400 text-xs">${u.lastActive}</td>
                    <td class="px-6 py-4 text-center font-bold text-slate-200">${u.transactions}</td>
                `;
                tbody.appendChild(tr);
            });
        }
    </script>
</body>
</html>
